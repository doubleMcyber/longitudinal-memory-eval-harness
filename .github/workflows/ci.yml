name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Acceptance gate (PRD §11, A1-A7)
        run: pytest -p no:cacheprovider -q
      - name: Determinism is reproducible across a fresh process
        run: |
          PYTHONPATH=src python - <<'PY'
          from mem_eval.data.suite import build_suite
          from mem_eval.adapters import get_backend
          from mem_eval.runner.orchestrate import run_eval
          h = [run_eval(get_backend("temporal_rag"), build_suite(seed=42), k=10)["determinism_hash"] for _ in range(2)]
          assert h[0] == h[1], h
          print("determinism OK", h[0][:16])
          PY
